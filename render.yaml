services:
  - type: web
    name: xiaolanhe
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: checksPass
    healthCheckPath: /readyz
    envVars:
      - key: XLH_DATABASE_URL
        fromDatabase:
          name: xiaolanhe-db
          property: connectionString
      - key: XLH_AI_API_KEY
        sync: false
      - key: XLH_SEARCH_ENABLED
        value: "false"
      - key: XLH_COOKIE_SECURE
        value: "true"
      - key: XLH_PUBLIC_ORIGIN
        value: "https://xiaolanhe.onrender.com"

databases:
  - name: xiaolanhe-db
    plan: free
    region: singapore
