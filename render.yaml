services:
  - type: web
    name: xiaolanhe
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: XLH_DATABASE_URL
        fromDatabase:
          name: xiaolanhe-db
          property: connectionString
      - key: XLH_AI_API_KEY
        sync: false
      - key: XLH_SEARCH_ENABLED
        value: "false"

databases:
  - name: xiaolanhe-db
    plan: free
    region: singapore
