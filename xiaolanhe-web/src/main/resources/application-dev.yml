spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/xiaolanhe
    username: xlh
    password: ${POSTGRES_PASSWORD:}
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3s
  flyway:
    enabled: true
  ai:
    openai:
      base-url: ${XLH_AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      api-key: ${XLH_AI_API_KEY:${DASHSCOPE_API_KEY:}}
      chat:
        options:
          model: ${XLH_AI_CHAT_MODEL:qwen3.5-plus}
          temperature: 0.4
      embedding:
        options:
          model: ${XLH_AI_EMBEDDING_MODEL:text-embedding-v4}

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: xiaolanhe-local-producer

xiaolanhe:
  search:
    enabled: true
    provider: searxng
    endpoint: ${SEARXNG_BASE_URL:http://127.0.0.1:8080}
    lightrag:
      enabled: false
      base-url: ${LIGHTRAG_BASE_URL:http://127.0.0.1:9621}
      api-key: ${XLH_LIGHTRAG_API_KEY:}
      query-mode: mix
      include-references: true
      include-chunk-content: true
      timeout: 20s
  storage:
    minio:
      endpoint: http://127.0.0.1:9000
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: xlh-dev
