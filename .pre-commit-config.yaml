repos:
  - repo: local
    hooks:
      - id: text-basics
        name: Text basics
        entry: .hooks/check-text-basics.sh
        language: script
        types: [text]
        exclude: '^(frontend/xiaolanhe-web/(dist|node_modules)/|go\.sum$)'

      - id: markdown-links
        name: Markdown relative links
        entry: .hooks/check-doc-links.sh
        language: script
        types: [markdown]

      - id: no-ai-placeholders
        name: No placeholder code
        entry: .hooks/check-no-placeholders.sh
        language: script
        types_or: [go, javascript, ts, tsx, yaml]
        exclude: '^(specs/|frontend/xiaolanhe-web/(dist|node_modules)/)'

      - id: clean-architecture
        name: Clean Architecture boundaries
        entry: .hooks/check-architecture.sh
        language: script
        pass_filenames: false
        always_run: true

      - id: spec-drift
        name: Spec or durable docs accompany behavior changes
        entry: .hooks/check-spec-drift.sh
        language: script
        pass_filenames: true
