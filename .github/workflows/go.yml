name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - codex/clean-architecture-refactor

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: xiaolanhe_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xiaolanhe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      XLH_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/xiaolanhe_test?sslmode=disable
      XLH_TEST_REDIS_URL: redis://:integration-password@127.0.0.1:6379/15
      XLH_TEST_ROCKETMQ_NAMESERVERS: 127.0.0.1:9876
      XLH_TEST_ROCKETMQ_BROKER_ADDR: 127.0.0.1:10911
      XLH_REDIS_PASSWORD: integration-password
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/xiaolanhe-web/package-lock.json
      - name: Start Redis and RocketMQ integration services
        run: docker compose -f deploy/docker-compose.middleware.yml up --detach --wait redis rmqnamesrv rmqbroker
      - run: npm --prefix frontend/xiaolanhe-web ci
      - name: Validate official LightRAG native-store manifest
        run: make lightrag-static
      - name: Official LightRAG image and runtime contract
        env:
          XLH_LIGHTRAG_API_KEY: ci-lightrag-private-key-at-least-32-chars
          XLH_LIGHTRAG_LLM_API_KEY: ci-placeholder
          XLH_LIGHTRAG_EMBEDDING_API_KEY: ci-placeholder
          XLH_LIGHTRAG_LLM_BASE_URL: http://127.0.0.1:9/v1
          XLH_LIGHTRAG_EMBEDDING_BASE_URL: http://127.0.0.1:9/v1
        run: |
          trap 'docker compose -f deploy/docker-compose.lightrag.yml logs --no-color lightrag; docker compose -f deploy/docker-compose.lightrag.yml down --volumes' EXIT
          docker compose -f deploy/docker-compose.lightrag.yml up --detach --wait lightrag
          bash deploy/check-lightrag-live.sh http://127.0.0.1:9621 "$XLH_LIGHTRAG_API_KEY"
      - name: Repository gates
        run: |
          if [ -n "${{ github.base_ref }}" ] && git rev-parse --verify "origin/${{ github.base_ref }}" >/dev/null 2>&1; then
            base_ref="origin/${{ github.base_ref }}"
          elif git rev-parse --verify origin/master >/dev/null 2>&1; then
            base_ref=origin/master
          else
            base_ref=HEAD^
          fi
          make ci BASE_REF="$base_ref"
      - name: Seed idempotency
        env:
          XLH_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/xiaolanhe_test?sslmode=disable
          XLH_SEED_ADMIN_PASSWORD: integration-password
        run: |
          go run ./cmd/seed
          go run ./cmd/seed
      - name: Container smoke
        env:
          XLH_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/xiaolanhe_test?sslmode=disable
        run: |
          docker build -t xiaolanhe:ci .
          container_id=$(docker run --detach --network host \
            -e PORT=18088 \
            -e XLH_DATABASE_URL="$XLH_DATABASE_URL" \
            -e XLH_AI_API_KEY=ci-placeholder \
            -e XLH_SEARCH_ENABLED=false \
            -e XLH_COOKIE_SECURE=false \
            -e XLH_PUBLIC_ORIGIN=http://127.0.0.1:18088 \
            xiaolanhe:ci)
          trap 'docker logs "$container_id"; docker rm -f "$container_id"' EXIT
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18088/healthz && break
            sleep 1
          done
          XLH_SMOKE_ADMIN_PASSWORD=integration-password \
            XLH_SMOKE_RUN_ID="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}" \
            bash scripts/smoke-product.sh
      - name: Middleware logs
        if: failure()
        run: docker compose -f deploy/docker-compose.middleware.yml logs --no-color redis rmqnamesrv rmqbroker
      - name: Stop integration services
        if: always()
        run: |
          docker compose -f deploy/docker-compose.lightrag.yml down --volumes
          docker compose -f deploy/docker-compose.middleware.yml down --volumes
